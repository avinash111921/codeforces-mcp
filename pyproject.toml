[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeforces-mcp"
version = "0.1.0"
description = "Production MCP server for Codeforces competitive programming, upsolving, and automated stress testing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.4.0",
    "httpx>=0.28.0",
    "curl-cffi>=0.9.0",
    "beautifulsoup4>=4.12.3",
    "pydantic>=2.10.0",
    "diskcache>=5.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
]

[project.scripts]
codeforces-mcp = "codeforces_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]